        - generic [ref=f12e65]:
          - generic [ref=f12e67]:
            - heading "ABOUT CATADA" [level=2] [ref=f12e68]
            - paragraph [ref=f12e69]:
              - img "CATADA Icon" [ref=f12e70]
              - text: CATADA is a central hub for data, best practices, consumer stories, and resources focused on improving access to assistive technology (AT) as reported by State and Territory Assistive Technology Programs. The AT Act requires these programs report data annually in a State Plan for AT and Annual Performance Report. CATADA serves as a repository for this data to support program planning and reporting to Congress, the Secretary of Health and Human Services, and other stakeholders, along with real-life stories showcasing the impact of AT programs.
            - heading "WHAT IS AT?" [level=3] [ref=f12e71]
            - paragraph [ref=f12e72]: Assistive technology (AT) plays a vital role in supporting independence for people with disabilities. It includes any device, equipment, or system—commercial, modified, or custom-made—used to enhance functional abilities of people with disabilities.
            - heading "WHAT ARE AT PROGRAMS?" [level=3] [ref=f12e73]
            - paragraph [ref=f12e74]: State and Territory Assistive Technology programs transform access to life-changing technology! These statewide, comprehensive, consumer-driven programs help people of all ages and abilities discover and obtain the AT tools they need to live, learn, work, and thrive—wherever life takes them.
            - paragraph [ref=f12e75]: Reauthorized in 2022, the 21st Century Assistive Technology Act provides formula grant funding to 56 state and territory programs to improve access, expand the availability, and raise awareness of AT for people with disabilities and older adults.
          - generic [ref=f12e77]:
            - heading "EYE ON DATA" [level=2] [ref=f12e78]
            - paragraph [ref=f12e79]:
              - strong [ref=f12e80]: Explore training topics by participant count across five topic areas
              - text: . In FY 2025, 56 AT programs trained 98,927 participants. The most common training topic focused on assistive technology such as instruction to build skills and competency in using AT and integrating AT across settings, reaching 55.3% of participants. For more national data, view the
              - link "State Data Summary report" [ref=f12e81] [cursor=pointer]:
                - /url: /assets/aggr_reports25/training
